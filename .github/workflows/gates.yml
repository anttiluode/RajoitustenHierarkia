name: gates

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Gate 0 — state-dependent operator
        run: python -m experiments.gate0_state_dependent_operator --check
      - name: Gate 1 — geometry / wiring / delay propagation
        run: python -m experiments.gate1_propagation_layers --check
      - name: Gate 2 — generic VAR history attacker
        run: python -m experiments.gate2_generic_history_attacker --check
      - name: Gate 3A — blind attribution vs random pokes
        run: python -m experiments.gate3_blind_layer_attribution
      - name: Gate 3B — learned fixed-panel attacker
        run: python -m experiments.gate3_static_panel_attacker --check
      - name: Gate 3C — moving-address attribution
        run: python -m experiments.gate3c_moving_address --check
      - name: Gate 3D — unseen-substrate representation audit
        run: python -m experiments.gate3d_unseen_substrates --check
      - name: Gate 3E — hard-budget delta diagnosis
        run: python -m experiments.gate3e_active_delta_budget --check
